name: covid19-big-data

services:
  # Kafka receives source COVID-19 records and makes them available to NiFi/Spark.
  kafka:
    image: apache/kafka:4.4.0
    container_name: covid-kafka
    hostname: kafka
    ports:
      # Use localhost:29092 from WSL. Other containers use kafka:9092.
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # NiFi consumes raw events from Kafka, performs ETL, then publishes clean events.
  nifi:
    image: apache/nifi:2.12.0
    container_name: covid-nifi
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8443:8443"
    environment:
      NIFI_WEB_HTTPS_PORT: "8443"
      NIFI_WEB_HTTPS_HOST: "0.0.0.0"
      NIFI_WEB_PROXY_HOST: "localhost:8443"
      SINGLE_USER_CREDENTIALS_USERNAME: "admin"
      # Local development password only. Replace it with your own password.
      SINGLE_USER_CREDENTIALS_PASSWORD: "CovidProjectLocal2026!"
      NIFI_JVM_HEAP_INIT: "512m"
      NIFI_JVM_HEAP_MAX: "1g"
    volumes:
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_database_repository:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile_repository:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content_repository:/opt/nifi/nifi-current/content_repository
      - nifi_provenance_repository:/opt/nifi/nifi-current/provenance_repository
    restart: unless-stopped

  # Run your PySpark Structured Streaming application inside this container.
  # It stays idle until you execute spark-submit with docker compose exec.
  spark:
    image: apache/spark:4.3.0-scala2.13-java17-python3-ubuntu
    container_name: covid-spark
    entrypoint: ["/bin/bash", "-lc"]
    command: ["sleep infinity"]
    working_dir: /opt/spark-apps
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      PYSPARK_PYTHON: "python3"
    ports:
      - "4040:4040"
      - "8888:8888"
    volumes:
      - ./spark:/opt/spark-apps
      - ./data:/opt/project-data:ro
      - spark_checkpoints:/tmp/spark-checkpoints
    restart: unless-stopped

  # PostgreSQL stores the analytics produced by Spark.
  postgres:
    image: postgres:17.11
    container_name: covid-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: "covid_db"
      POSTGRES_USER: "covid_user"
      # Local development password only. Replace it with your own password.
      POSTGRES_PASSWORD: "covid_dev_password"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U covid_user -d covid_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  kafka_data:
  nifi_conf:
  nifi_database_repository:
  nifi_flowfile_repository:
  nifi_content_repository:
  nifi_provenance_repository:
  postgres_data:
  spark_checkpoints:
